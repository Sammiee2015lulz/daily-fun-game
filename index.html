<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Jumper - Daily Fun Game</title>
<style>
body { margin:0; background:#0a0a1a; color:#0ff; font-family: 'Courier New', monospace; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; overflow:hidden; }
canvas { border: 2px solid #0ff; box-shadow: 0 0 20px #0ff; background: linear-gradient(#000, #001a33); }
h1 { text-shadow: 0 0 10px #0ff; margin:10px; }
#score { font-size:24px; text-shadow:0 0 5px #0ff; }
#instructions { margin:10px; text-align:center; }
button { background:#0ff; color:#000; border:none; padding:10px 20px; font-size:18px; cursor:pointer; box-shadow:0 0 10px #0ff; }
button:hover { background:#fff; }
</style>
</head>
<body>
<h1>🚀 Neon Jumper</h1>
<div id="score">Score: 0 | High: 0</div>
<canvas id="game" width="800" height="400"></canvas>
<div id="instructions">Space / Click / Tap to Jump | Avoid the spikes | Collect stars!</div>
<button id="startBtn">Start Game</button>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const startBtn = document.getElementById('startBtn');

let player = { x: 100, y: 300, w: 30, h: 30, vy: 0, onGround: false };
let obstacles = [];
let stars = [];
let score = 0;
let highScore = localStorage.getItem('neonJumperHigh') || 0;
let gameSpeed = 5;
let gameRunning = false;
let gravity = 0.8;
let jumpPower = -15;
let frame = 0;

function updateScore() {
  scoreEl.textContent = `Score: ${score} | High: ${highScore}`;
}
updateScore();

function spawnObstacle() {
  obstacles.push({ x: canvas.width, y: 350, w: 40, h: 50, type: 'spike' });
}

function spawnStar() {
  stars.push({ x: canvas.width, y: 200 + Math.random()*100, w: 20, h: 20 });
}

function drawPlayer() {
  ctx.fillStyle = '#0ff';
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#0ff';
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.shadowBlur = 0;
}

function drawObstacles() {
  ctx.fillStyle = '#f0f';
  obstacles.forEach(o => {
    ctx.beginPath();
    ctx.moveTo(o.x, o.y + o.h);
    ctx.lineTo(o.x + o.w/2, o.y);
    ctx.lineTo(o.x + o.w, o.y + o.h);
    ctx.fill();
  });
}

function drawStars() {
  ctx.fillStyle = '#ff0';
  stars.forEach(s => {
    ctx.beginPath();
    ctx.arc(s.x + s.w/2, s.y + s.h/2, s.w/2, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#ff0';
  });
  ctx.shadowBlur = 0;
}

function update() {
  if (!gameRunning) return;
  frame++;
  // Player physics
  player.vy += gravity;
  player.y += player.vy;
  if (player.y + player.h > 350) {
    player.y = 350 - player.h;
    player.vy = 0;
    player.onGround = true;
  } else {
    player.onGround = false;
  }

  // Move objects
  obstacles.forEach(o => o.x -= gameSpeed);
  stars.forEach(s => s.x -= gameSpeed);

  // Spawn
  if (frame % 90 === 0) spawnObstacle();
  if (frame % 120 === 0) spawnStar();

  // Collisions
  obstacles = obstacles.filter(o => {
    if (o.x + o.w < 0) return false;
    if (player.x < o.x + o.w && player.x + player.w > o.x &&
        player.y < o.y + o.h && player.y + player.h > o.y) {
      gameOver();
      return false;
    }
    return true;
  });

  stars = stars.filter(s => {
    if (s.x + s.w < 0) return false;
    if (player.x < s.x + s.w && player.x + player.w > s.x &&
        player.y < s.y + s.h && player.y + player.h > s.y) {
      score += 50;
      updateScore();
      return false;
    }
    return true;
  });

  score++;
  if (score % 500 === 0) gameSpeed += 0.5;
  updateScore();

  // Draw
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // Ground
  ctx.fillStyle = '#0a0';
  ctx.fillRect(0, 350, canvas.width, 50);
  drawPlayer();
  drawObstacles();
  drawStars();

  requestAnimationFrame(update);
}

function jump() {
  if (player.onGround && gameRunning) {
    player.vy = jumpPower;
  }
}

function gameOver() {
  gameRunning = false;
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('neonJumperHigh', highScore);
  }
  updateScore();
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#f00';
  ctx.font = '40px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
  ctx.font = '20px Courier New';
  ctx.fillText(`Score: ${score}`, canvas.width/2, canvas.height/2 + 40);
  startBtn.style.display = 'block';
}

function startGame() {
  player = { x: 100, y: 300, w: 30, h: 30, vy: 0, onGround: false };
  obstacles = [];
  stars = [];
  score = 0;
  gameSpeed = 5;
  frame = 0;
  gameRunning = true;
  startBtn.style.display = 'none';
  updateScore();
  update();
}

startBtn.addEventListener('click', startGame);
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); jump(); } });
canvas.addEventListener('click', jump);
canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); });
</script>
</body>
</html>
